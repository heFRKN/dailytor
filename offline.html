<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çevrimdışı - Dailytor</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --primary: #6366f1;
        }
        [data-theme="dark"] {
            --bg-primary: #111827;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .icon {
            color: var(--primary);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px;
        }
        p {
            color: var(--text-secondary);
            margin: 0 0 30px;
            max-width: 300px;
            line-height: 1.5;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
            <line x1="2" y1="2" x2="22" y2="22"></line>
        </svg>
    </div>
    <h1>İnternet Bağlantısı Yok</h1>
    <p>Görünüşe göre çevrimdışısınız. Dailytor'u kullanmaya devam etmek için lütfen internet bağlantınızı kontrol edin.</p>
    <button class="btn" onclick="window.location.reload()">Tekrar Dene</button>

    <script>
        // Check local storage for theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        
        // Listen for online event to auto-reload
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
